version: '1.2'

services: 
  mongodb: 
    image: mongo:7
    container_name: todo-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    networks: 
      - todo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Server
    container_name: todo-backend
    ports: 
      -  "5000:5000"
    env_file:
      - .env
    depends_on: 
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy 

    networks:
      - todo-network
    restart: unless-stopped 

  frontend:
    build:
      context: ./client
    container_name: todo-frontend
    ports: 
      -  "3000:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - todo-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  todo-network:
    driver: bridge
